rules:
  - id: unsafe-yaml-load
    languages: [python]
    severity: ERROR
    message: >-
      yaml.load() without SafeLoader can construct arbitrary Python objects
      (remote code execution on untrusted input). Use yaml.safe_load().
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)

  - id: pickle-loads
    languages: [python]
    severity: WARNING
    message: >-
      pickle.loads() executes code embedded in the payload. Make sure the data
      never comes from an untrusted source; prefer JSON.
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      confidence: MEDIUM
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
